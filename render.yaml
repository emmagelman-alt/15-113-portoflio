services:
  - type: web
    name: andean-dashboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: andean-dashboard-db
          property: connectionString
      - key: BASE_URL
        sync: false
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_TASKS_DATABASE_ID
        sync: false

databases:
  - name: andean-dashboard-db
    plan: basic-256mb
