services:
  - type: web
    name: sobremesa-private-demo
    runtime: python
    plan: free
    rootDir: barcelona-spanish-practice
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DEMO_AUTH_REQUIRED
        value: '1'
      - key: DEMO_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LINGOLIX_API_KEY
        sync: false
  - type: web
    name: andean-dashboard-demo
    runtime: python
    plan: free
    rootDir: andean-dashboard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # Password-protected demo: no Microsoft/Slack/Notion; refuses to start without DEMO_PASSWORD (16+ chars, e.g. a four-word passphrase)
      - key: APP_ENV
        value: demo
      - key: DEMO_PASSWORD
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        value: andean.test
      - key: SESSION_SECRET
        generateValue: true
      # Postgres connection string (e.g. a free Neon database), set in Render. Without it the
      # demo uses a SQLite file that Render erases on every restart, so visitors' changes are lost.
      - key: DATABASE_URL
        sync: false
      # sherpa.ai: demo-only keys, set in Render (never in this repo). Without both, the
      # panel shows its labelled sample chat.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: emmagelman-alt/ANDEAN-DESIGN
      - key: GITHUB_BRANCH
        value: main
