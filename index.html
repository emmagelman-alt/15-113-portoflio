<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emma Gelman — Welcome to my desk</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="stage">
    <!--
      The scene is a fixed 1600x900 canvas (same size as the drawn frames) that
      gets scaled to fit the window. Everything inside is positioned in the
      drawing's own pixel coordinates, so hotspots line up on every frame.
    -->
    <div class="scene" id="scene">

      <!-- Animation frames: drop your exported frames into images/frames/ -->
      <div class="frames" id="frames">
        <img class="frame is-active" src="images/frames/frame-01.png" alt="Emma at her desk" />
        <img class="frame" src="images/frames/frame-02.png" alt="" />
        <img class="frame" src="images/frames/frame-03.png" alt="" />
        <img class="frame" src="images/frames/frame-04.png" alt="" />
        <img class="frame" src="images/frames/frame-05.png" alt="" />
        <img class="frame" src="images/frames/frame-06.png" alt="" />
        <img class="frame" src="images/frames/frame-07.png" alt="" />
      </div>

      <!-- Squiggles on the wall (coming soon -> will link to project pages) -->
      <button class="hotspot squiggle" style="--x:740; --y:172; --w:160; --h:130" data-name="Project 1" aria-label="Project 1 (coming soon)"></button>
      <button class="hotspot squiggle" style="--x:1050; --y:238; --w:175; --h:190" data-name="Project 2" aria-label="Project 2 (coming soon)"></button>
      <button class="hotspot squiggle" style="--x:1285; --y:170; --w:205; --h:180" data-name="Project 3" aria-label="Project 3 (coming soon)"></button>
      <button class="hotspot squiggle" style="--x:835; --y:380; --w:175; --h:180" data-name="Project 4" aria-label="Project 4 (coming soon)"></button>
      <button class="hotspot squiggle" style="--x:1240; --y:455; --w:185; --h:160" data-name="Project 5" aria-label="Project 5 (coming soon)"></button>

      <!-- "ABOUT!" lettering on the desk -->
      <a class="hotspot about" href="about.html" style="--x:410; --y:668; --w:300; --h:135" aria-label="About"></a>

      <!-- Phone screen overlay (skewed to match the drawn phone) -->
      <div class="phone-screen">
        <div class="clock" id="clock" aria-live="off">00:00</div>
        <div class="phone-apps">
          <a class="app" href="mailto:emma.gillman@icloud.com" aria-label="Email Emma">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          </a>
          <a class="app" href="https://github.com/emmagelman-alt" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="filled"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
          </a>
          <button class="app pending" data-name="LinkedIn" aria-label="LinkedIn (coming soon)">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="filled"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          </button>
          <button class="app pending" data-name="Instagram" aria-label="Instagram (coming soon)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <!-- Speech bubble shown when something isn't ready yet -->
      <div class="bubble" id="bubble" role="status" hidden>Coming soon!</div>

      <!-- Shown only if the frame images can't be found -->
      <div class="missing-frames" id="missingFrames" hidden>
        Add your animation frames to <code>images/frames/</code> as
        <code>frame-01.png</code> … <code>frame-07.png</code>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
