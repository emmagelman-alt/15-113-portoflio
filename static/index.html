<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andean Dashboard</title>
  <link rel="icon" href="/static/logomark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <img class="mark" src="/static/logomark.svg" alt="">
    <span class="title">Andean Dashboard</span>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="btn btn-ghost" id="logout" type="button">Sign out</button>
  </header>

  <main>
    <section class="greeting">
      <h1 id="greeting">Welcome</h1>
      <p id="summary">Loading your to-dos…</p>
    </section>

    <section class="card" aria-labelledby="suggested-heading" id="suggested-section" hidden>
      <h2 id="suggested-heading">Suggested from Slack</h2>
      <ul class="todo-list" id="suggested-list"></ul>
    </section>

    <section class="card" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a to-do</h2>
      <form id="add-form" class="add-form">
        <div class="field-title">
          <label for="title">What needs doing?</label>
          <input id="title" type="text" maxlength="300" required autocomplete="off" placeholder="e.g. Draft the onboarding deck">
        </div>
        <div>
          <label for="due">Due</label>
          <input id="due" type="date">
        </div>
        <div>
          <label for="assignee">Assign to</label>
          <select id="assignee"></select>
        </div>
        <button class="btn" type="submit">Add</button>
      </form>
      <p id="form-error" class="form-error" role="alert" hidden></p>
    </section>

    <section class="card" aria-labelledby="list-heading">
      <h2 id="list-heading">My to-dos</h2>
      <div class="tabs" id="tabs" role="toolbar" aria-label="Filter by source"></div>
      <ul class="todo-list" id="open-list"></ul>
      <p class="empty" id="empty" hidden>Nothing here. Nice work.</p>
      <details id="done-section" hidden>
        <summary id="done-summary">Completed</summary>
        <ul class="todo-list" id="done-list"></ul>
      </details>
    </section>

    <section class="card" aria-labelledby="sent-heading" id="sent-section" hidden>
      <h2 id="sent-heading">Sent to coworkers</h2>
      <ul class="todo-list" id="sent-list"></ul>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
